<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FreeSell · Buy & Sell Pre-Owned With Confidence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#F6F5F1;--surface:#FFFFFF;--ink:#10201B;--muted:#56625E;--line:#E4E1D8;--soft:#F0EEE8;
  --accent:#0F6B52;--on-accent:#FFFFFF;--accent-ink:#0A4F3C;--accent-soft:#E3F0EA;
  --amber-soft:#FBEFD9;--amber-ink:#7A4E0E;--sel-bg:#10201B;--sel-fg:#FFFFFF;--sel-sub:rgba(255,255,255,.76);--sel-cta:#8BE3BF;
  --shadow:0 24px 48px -24px rgba(16,32,27,.45);
  --display:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;
  --body:'Manrope','Helvetica Neue',ui-sans-serif,system-ui,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1714;--surface:#16211D;--ink:#EEF2EF;--muted:#A3B0AB;--line:#26332E;--soft:#1E2A26;
  --accent:#3FB88A;--on-accent:#0B1411;--accent-ink:#8BE3BF;--accent-soft:#173A2E;
  --amber-soft:#3A2C14;--amber-ink:#F2C77E;--sel-bg:#EEF2EF;--sel-fg:#0E1714;--sel-sub:rgba(14,23,20,.72);--sel-cta:#0F6B52;
  --shadow:0 24px 48px -24px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --bg:#0E1714;--surface:#16211D;--ink:#EEF2EF;--muted:#A3B0AB;--line:#26332E;--soft:#1E2A26;
  --accent:#3FB88A;--on-accent:#0B1411;--accent-ink:#8BE3BF;--accent-soft:#173A2E;
  --amber-soft:#3A2C14;--amber-ink:#F2C77E;--sel-bg:#EEF2EF;--sel-fg:#0E1714;--sel-sub:rgba(14,23,20,.72);--sel-cta:#0F6B52;
  --shadow:0 24px 48px -24px rgba(0,0,0,.7);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 96px);scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
img{max-width:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent-ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:8px}
.wrap{max-width:1312px;margin:0 auto;padding:0 32px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.display{font-family:var(--display);font-weight:700;letter-spacing:-.035em;line-height:1}
.muted{color:var(--muted)}
svg.i{flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hdr .wrap{height:76px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.logo-mark{width:34px;height:34px;border-radius:10px;background:var(--sel-bg);color:var(--sel-cta);display:grid;place-items:center}
.logo-word{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.02em}
.logo-word b{color:var(--accent);font-weight:800}
.nav{display:flex;gap:30px;font-weight:700;font-size:15px}
.nav button{background:none;border:0;padding:8px 0;color:var(--ink);font-weight:700}
.nav button:hover{color:var(--accent-ink)}
.hdr-r{display:flex;align-items:center;gap:10px}
.ibtn{width:44px;height:44px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.tbtn{height:44px;padding:0 14px;border:0;background:none;font-weight:700;color:var(--ink)}
.pill{height:44px;padding:0 22px;border-radius:999px;border:0;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:15px;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.menu-btn{display:none}
.searchbar{display:none;border-top:1px solid var(--line)}
.searchbar.open{display:block}
.searchbar form{display:flex;gap:10px;padding:14px 0}
.field{flex:1;height:48px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 18px;display:flex;align-items:center;gap:10px}
.field input{border:0;outline:0;background:transparent;flex:1;min-width:0;font-size:16px}
.mnav{display:none;border-top:1px solid var(--line)}
.mnav.open{display:block}
.mnav .wrap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding-top:12px;padding-bottom:16px}
.mnav button{height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:700;text-align:left;padding:0 16px}

/* home */
.hero{padding:56px 0 0;display:flex;justify-content:space-between;align-items:flex-end;gap:48px}
.hero-l{display:flex;flex-direction:column;gap:20px;max-width:760px}
.chip{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;padding:8px 14px 8px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);font-size:14px;font-weight:800}
.hero h1{margin:0;font-size:clamp(42px,6.4vw,84px)}
.hero p{margin:0;font-size:clamp(16px,1.6vw,20px);color:var(--muted);max-width:600px}
.peek{width:380px;flex-shrink:0;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:14px;box-shadow:var(--shadow)}
.ph{position:relative;border-radius:16px;display:grid;place-items:center;color:var(--muted);font-size:13px;font-weight:700}
.ph .ph-in{display:flex;flex-direction:column;align-items:center;gap:6px}
.badge{position:absolute;top:12px;left:12px;display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:800}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.score{padding:5px 10px;border-radius:999px;font-size:13px;font-weight:800;white-space:nowrap}
.score.hi{background:var(--accent-soft);color:var(--accent-ink)}
.score.mid{background:var(--amber-soft);color:var(--amber-ink)}

.choose{margin-top:44px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.big{min-height:260px;padding:32px 34px;border-radius:28px;background:var(--surface);border:1px solid var(--line);text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:22px;transition:background .2s,box-shadow .2s,transform .2s}
.big:hover{transform:translateY(-2px)}
.big .top{display:flex;justify-content:space-between;align-items:flex-start}
.big .tile{width:64px;height:64px;border-radius:18px;display:grid;place-items:center}
.big.buy .tile{background:var(--accent-soft);color:var(--accent-ink)}
.big.sell .tile{background:var(--amber-soft);color:var(--amber-ink)}
.big .check{width:36px;height:36px;border-radius:999px;background:var(--sel-cta);color:var(--sel-bg);display:grid;place-items:center;opacity:0;transition:opacity .2s}
.big h2{margin:0;font-size:clamp(34px,4vw,50px)}
.big .desc{font-size:18px;color:var(--muted);display:block;margin-top:10px}
.big .cta{font-weight:800;font-size:17px;color:var(--accent-ink);display:inline-flex;align-items:center;gap:8px}
.big[aria-pressed="true"]{background:var(--sel-bg);border-color:var(--sel-bg);color:var(--sel-fg);box-shadow:var(--shadow)}
.big[aria-pressed="true"] .desc{color:var(--sel-sub)}
.big[aria-pressed="true"] .cta{color:var(--sel-cta)}
.big[aria-pressed="true"] .check{opacity:1}

.step{margin-top:80px;transition:opacity .25s}
.step[data-locked="true"]{opacity:.38;pointer-events:none}
.step-h{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.step-h .l{display:flex;align-items:center;gap:14px}
.num{width:40px;height:40px;border-radius:12px;background:var(--sel-bg);color:var(--sel-fg);font-weight:800;font-size:15px;display:grid;place-items:center;flex-shrink:0}
.step-h h2{margin:0;font-size:clamp(28px,3vw,40px)}
.hint{font-size:15px;font-weight:700;color:var(--muted)}
.cities{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}
.opt{background:var(--surface);border:1px solid var(--line);border-radius:22px;text-align:left;transition:box-shadow .15s,border-color .15s,background .15s}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.opt .ic{background:var(--soft);color:var(--ink);display:grid;place-items:center;flex-shrink:0}
.opt[aria-pressed="true"] .ic{background:var(--accent);color:var(--on-accent)}
.city{height:152px;padding:20px;display:flex;flex-direction:column;justify-content:space-between}
.city .ic{width:46px;height:46px;border-radius:999px}
.city b{display:block;font-size:20px}
.city span{font-size:14px;color:var(--muted)}
.soon{margin-top:18px;font-weight:700;color:var(--muted);font-size:15px}
.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.cat{min-height:112px;padding:22px;display:flex;align-items:center;gap:18px}
.cat .ic{width:56px;height:56px;border-radius:16px}
.cat b{display:block;font-size:19px}
.cat span{display:block;font-size:15px;color:var(--muted);line-height:1.4;margin-top:2px}

.trust{margin-top:112px;background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:88px 0}
.trust .wrap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:72px;align-items:center}
.trust h2{margin:0;font-size:clamp(34px,4.4vw,60px);line-height:1.02}
.pillars{margin-top:36px;display:flex;flex-direction:column;gap:24px}
.pillar{display:flex;gap:18px;align-items:flex-start}
.pillar .ic{width:52px;height:52px;border-radius:16px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;flex-shrink:0}
.pillar b{display:block;font-size:20px}
.report{background:var(--bg);border:1px solid var(--line);border-radius:28px;padding:32px;display:flex;flex-direction:column;gap:22px}
.rep-k{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:800;color:var(--accent-ink)}
.tag{padding:6px 12px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:800}
.bar{height:8px;border-radius:999px;background:var(--line)}
.bar i{display:block;height:8px;border-radius:999px;background:var(--accent)}
.bars{display:flex;flex-direction:column;gap:14px}
.bars .row{font-size:14px;font-weight:700;margin-bottom:6px}
footer.ft{padding:36px 0 120px}
footer.ft .wrap{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;color:var(--muted);font-size:15px}
footer.ft nav{display:flex;gap:24px;flex-wrap:wrap;font-weight:700}
footer.ft nav a{color:var(--ink);text-decoration:none}

/* marketplace */
.crumb{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;color:var(--muted);padding-top:32px}
.crumb button{background:none;border:0;padding:0;color:var(--muted);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.mk-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin:16px 0 22px;flex-wrap:wrap}
.mk-h h1{margin:0;font-size:clamp(32px,4vw,52px)}
.filters{display:flex;gap:10px;flex-wrap:wrap}
.fchip{height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:8px}
.fchip[aria-pressed="true"]{background:var(--sel-bg);border-color:var(--sel-bg);color:var(--sel-fg)}
.note{margin:20px 0 28px;padding:16px 20px;border-radius:18px;background:var(--accent-soft);color:var(--accent-ink);display:flex;gap:12px;align-items:center;font-weight:700;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column}
.card .ph{height:220px;border-radius:0}
.save{position:absolute;top:10px;right:10px;width:44px;height:44px;border-radius:999px;border:0;background:var(--surface);color:var(--ink);display:grid;place-items:center}
.save[aria-pressed="true"]{color:#C2410C}
.save[aria-pressed="true"] svg{fill:currentColor}
.card .body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:11px}
.card .nm{font-size:17px;font-weight:800;line-height:1.3;min-height:44px}
.card .pr{font-family:var(--display);font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1}
.meta{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.mini{flex:1;height:6px;border-radius:999px;background:var(--line)}
.mini i{display:block;height:6px;border-radius:999px}
.hr{height:1px;background:var(--line)}
.foot{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:700;flex-wrap:wrap}
.foot span{display:inline-flex;align-items:center;gap:6px}
.empty{grid-column:1/-1;padding:48px;border:1px dashed var(--line);border-radius:22px;text-align:center}

/* sell */
.sell-grid{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:48px;align-items:start;padding-bottom:40px}
.sell-grid h1{margin:10px 0 12px;font-size:clamp(36px,4.6vw,60px)}
.steps{list-style:none;margin:28px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
.st{background:var(--surface);border:1px solid var(--line);border-radius:22px}
.st-h{width:100%;display:flex;align-items:center;gap:16px;padding:20px 24px;background:none;border:0;text-align:left}
.st-h:disabled{cursor:default}
.st .n{width:44px;height:44px;border-radius:14px;background:var(--soft);font-weight:800;font-size:17px;display:grid;place-items:center;flex-shrink:0}
.st.active{box-shadow:var(--shadow)}
.st.active .n{background:var(--accent);color:var(--on-accent)}
.st.done .n{background:var(--accent-soft);color:var(--accent-ink)}
.st-h b{display:block;font-size:18px}
.st-h small{display:block;font-size:14px;color:var(--muted)}
.st-b{padding:4px 24px 26px;display:none;flex-direction:column;gap:22px}
.st.active .st-b{display:flex}
.lbl{font-size:15px;font-weight:800;display:block;margin-bottom:8px}
.inp{width:100%;height:56px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 18px;font-size:16px}
.chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.sc{min-height:52px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:800;font-size:15px;text-align:left}
.sc small{display:block;font-weight:500;font-size:13px;color:var(--muted)}
.sc[aria-pressed="true"]{background:var(--sel-bg);border-color:var(--sel-bg);color:var(--sel-fg)}
.sc[aria-pressed="true"] small{color:var(--sel-sub)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.box{padding:18px;border-radius:18px;border:1px solid var(--line);background:var(--bg)}
.go{align-self:flex-end;height:56px;padding:0 28px;border-radius:999px;border:0;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:16px}
.err{color:#B42318;font-weight:700;font-size:14px;display:none}
:root[data-theme="dark"] .err{color:#FDA29B}
.side{display:flex;flex-direction:column;gap:16px;position:sticky;top:110px}
.verify{background:var(--sel-bg);color:var(--sel-fg);border-radius:28px;padding:32px;display:flex;flex-direction:column;gap:18px}
.verify h2{margin:0;font-size:36px;line-height:1.05}
.verify p{margin:0;color:var(--sel-sub)}
.verify li{display:flex;gap:10px;align-items:center;font-weight:700}
.verify ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.verify .v{color:var(--sel-cta)}
.aux{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:24px;display:flex;gap:16px}
.aux .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex-shrink:0}
.done-card{text-align:center;padding:56px 32px;background:var(--surface);border:1px solid var(--line);border-radius:28px;margin-top:28px}

.sticky-sell{display:none}
dialog{border:1px solid var(--line);border-radius:24px;background:var(--surface);color:var(--ink);padding:28px;width:min(420px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.4)}

/* responsive */
@media (max-width:1180px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.peek{display:none}.cities{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:980px){.nav{display:none}.menu-btn{display:grid}.trust .wrap{grid-template-columns:1fr;gap:40px}.sell-grid{grid-template-columns:1fr}.side{position:static}.cats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:720px){
  .wrap{padding:0 20px}
  .hdr .wrap{height:64px}
  .logo-word{font-size:21px}.logo-mark{width:28px;height:28px}
  .hdr-r .tbtn,.hdr-r .pill{display:none}
  .ibtn{border:0;background:none}
  .hero{padding-top:24px}
  .chip{font-size:12px}
  .choose{grid-template-columns:1fr;gap:12px;margin-top:24px}
  .big{min-height:0;padding:20px;border-radius:24px;gap:14px}
  .big .tile{width:52px;height:52px;border-radius:16px}
  .big .desc{font-size:15px;margin-top:6px}
  .step{margin-top:40px}
  .cities{display:flex;overflow-x:auto;gap:10px;margin:0 -20px;padding:2px 20px 8px;scroll-snap-type:x mandatory}
  .city{flex:0 0 124px;height:108px;padding:14px;scroll-snap-align:start}
  .city .ic{width:36px;height:36px}.city b{font-size:16px}.city span{display:none}
  .cats{gap:10px}
  .cat{flex-direction:column;align-items:flex-start;padding:16px;gap:10px;min-height:124px}
  .cat .ic{width:40px;height:40px;border-radius:12px}
  .cat b{font-size:15px}.cat span{font-size:12.5px}
  .cats .cat:last-child{grid-column:span 2;flex-direction:row;align-items:center;min-height:0}
  .trust{margin-top:56px;padding:40px 0}
  .report{padding:22px}
  .grid{grid-template-columns:1fr;gap:16px}
  .chips{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two{grid-template-columns:1fr}
  .st-h{padding:16px}.st-b{padding:0 16px 20px}
  .sticky-sell{display:block;position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 20px calc(16px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 96%,transparent);border-top:1px solid var(--line)}
  .sticky-sell .pill{width:100%;height:54px;justify-content:center;font-size:16px}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="wrap">
    <a class="logo" href="#/" aria-label="FreeSell home">
      <span class="logo-mark" data-icon="check" data-size="18" data-sw="2.8"></span>
      <span class="logo-word">FREE<b>SELL</b></span>
    </a>
    <nav class="nav" aria-label="Main">
      <button type="button" data-nav="buy">Buy</button>
      <button type="button" data-nav="sell">Sell</button>
      <button type="button" data-nav="rent">Rent</button>
      <button type="button" data-nav="cars">Cars</button>
      <button type="button" data-nav="properties">Properties</button>
    </nav>
    <div class="hdr-r">
      <button type="button" class="ibtn" id="searchBtn" aria-label="Search" aria-expanded="false" data-icon="search" data-size="20"></button>
      <button type="button" class="tbtn" data-login>Login</button>
      <button type="button" class="pill" data-nav="sell">Sell Something</button>
      <button type="button" class="ibtn menu-btn" id="menuBtn" aria-label="Menu" aria-expanded="false" data-icon="menu" data-size="22"></button>
    </div>
  </div>
  <div class="searchbar" id="searchbar">
    <div class="wrap">
      <form id="searchForm" role="search">

function advance(id){requestAnimationFrame(()=>{const el=document.getElementById(id);if(el){el.scrollIntoView({block:'start'});const f=el.querySelector('button');f&&f.focus({preventScroll:true})}})}

/* ---------- MARKETPLACE ---------- */
function market(city,cat){
  const isSearch=!cat;
  let items=[];
  if(isSearch){Object.entries(P).forEach(([k,arr])=>arr.forEach(p=>items.push([...p,k])));const q=S.q.toLowerCase();items=items.filter(p=>p[0].toLowerCase().includes(q)||CATS[p[5]][0].toLowerCase().includes(q))}
  else items=(P[cat]||[]).map(p=>[...p,cat]);
  const f=S.filters;
  if(f.hi) items=items.filter(p=>p[3]>=8.5);
  if(f.del) items=items.filter(p=>p[4]);
  const title=isSearch?`Results for “${esc(S.q)}”`:`Verified ${esc(CATS[cat][0].toLowerCase())} in ${esc(city)}`;
  app.innerHTML=`<div class="wrap">
    <nav class="crumb" aria-label="Breadcrumb"><button type="button" id="back">Buy</button><span>/</span><span>${esc(city||'All cities')}</span>${cat?`<span>/</span><span style="color:var(--ink)">${esc(CATS[cat][0])}</span>`:''}</nav>
    <div class="mk-h"><h1 class="display">${title}</h1><span class="hint">${items.length} listing${items.length===1?'':'s'}</span></div>
    <div class="filters" role="group" aria-label="Filters">
      <button type="button" class="fchip" data-f="ins" aria-pressed="${f.ins}">${f.ins?ic('check',16,2.6):''}FreeSell Inspected</button>
      <button type="button" class="fchip" data-f="hi" aria-pressed="${f.hi}">Condition 8.5+</button>
      <button type="button" class="fchip" data-f="del" aria-pressed="${f.del}">Delivery available</button>
    </div>
    <div class="note">${ic('shield',22,2)}Every listing here was physically inspected. Open any item to read its full FreeSell Condition Report before you pay.</div>
    <div class="grid">${items.length?items.map((p,i)=>{const [n,pr,age,sc,del,k]=p;const hi=sc>=8.5;const saved=S.saved.has(n);return `
      <article class="card">
        <div class="ph" style="background:${TINTS[i%4]};color:#56625E"><span class="ph-in">${ic(k,34,1.6)}Product photo</span>
          <span class="badge">${ic('check',14,3)}FreeSell Inspected</span>
          <button type="button" class="save" data-save="${esc(n)}" aria-pressed="${saved}" aria-label="Save ${esc(n)}">${ic('heart',20)}</button></div>
        <div class="body">
          <span class="nm">${esc(n)}</span>
          <span class="pr">${inr(pr)}</span>
          <span class="meta">${ic('pin',16,2)}${esc(city||'Bengaluru')} · ${esc(age)}</span>
          <div style="display:flex;align-items:center;gap:10px"><span class="score ${hi?'hi':'mid'}">Condition ${sc.toFixed(1)}/10</span><span class="mini"><i style="width:${sc*10}%;background:${hi?'var(--accent-ink)':'var(--amber-ink)'}"></i></span></div>

          <div class="foot"><span style="color:var(--accent-ink)">${ic('user',16,2)}Seller verified</span><span class="${del?'':'muted'}">${ic('truck',16,2)}${del?'Delivery available':(k==='cars'||k==='properties'?'Visit / test drive':'Pickup only')}</span></div>

  const body=n=>{switch(n){
    case 1:return `<div class="box row"><span style="display:flex;gap:10px;align-items:center">${ic(cat,22,1.8)}<span class="muted" style="font-weight:700;font-size:14px">Category</span><b>${esc(CATS[cat][0])}</b></span><button type="button" class="tbtn" id="chgCat" style="height:auto;padding:0;color:var(--accent-ink);text-decoration:underline">Change</button></div>
      <div><label class="lbl" for="prod">What are you selling?</label><input class="inp" id="prod" value="${esc(SF.product)}" placeholder="e.g. Sony Bravia 55-inch 4K TV"></div>
      <div><span class="lbl">How old is it?</span><div class="chips">${['Under 1 year','1–2 years','2–4 years','4+ years'].map(a=>chip('age',a,a)).join('')}</div></div>
      <div><span class="lbl">What condition is it in?</span><div class="chips">${[['Like new','No visible marks'],['Good','Minor signs of use'],['Fair','Visible wear, works fine'],['Needs repair','Has a known fault']].map(([a,b])=>chip('cond',a,a,b)).join('')}</div></div>
      <p class="err" id="e1">Add what you’re selling, its age and its condition to continue.</p>
      <button type="button" class="go" data-next>Continue to photos</button>`;
    case 2:return `<div class="two">${chip('photo','upload','Upload photos','Add at least 3 clear photos')}${chip('photo','agent','Request an agent visit','A FreeSell agent takes the photos')}</div>
      ${SF.photo==='upload'?`<label class="box" style="display:flex;gap:12px;align-items:center;cursor:pointer">${ic('upload',22)}<span><b>${SF.files?SF.files+' photo'+(SF.files>1?'s':'')+' selected':'Choose photos'}</b><small class="muted" style="display:block">JPG or PNG from your phone or computer</small></span><input type="file" id="files" accept="image/*" multiple class="sr"></label>`:''}
      ${SF.photo==='agent'?`<div><span class="lbl">When should the agent visit?</span><div class="chips">${['Today','Tomorrow','This weekend','Pick a date'].map(a=>chip('visit',a,a)).join('')}</div></div>`:''}
      <p class="err" id="e2">Choose photos or book an agent visit to continue.</p>
      <button type="button" class="go" data-next>Continue to verification</button>`;
    case 3:return hv?`<div class="box" style="display:flex;gap:14px">${ic('shield',26)}<div><b>Your ${esc(CATS[cat][0].toLowerCase())} qualifies for physical inspection.</b><p class="muted" style="margin:4px 0 0">We’ll verify it before it goes live. ${SF.photo==='agent'?'The agent will inspect it during the photo visit.':'We’ll schedule a short inspection at your address.'}</p></div></div>
      <button type="button" class="go" data-next>Book inspection</button>`
      :`<div class="box" style="display:flex;gap:14px">${ic('user',26)}<div><b>Quick seller verification</b><p class="muted" style="margin:4px 0 0">Confirm your phone number and a government ID. It takes a couple of minutes and only happens once.</p></div></div>
      <button type="button" class="go" data-next>Verify me</button>`;
    case 4:{const base={'Like new':9.2,'Good':8.4,'Fair':7.2,'Needs repair':5.5}[SF.cond]||8;return `<div class="report" style="padding:22px"><div class="row"><span class="rep-k">${ic('doc',18,2)}Condition Report preview</span><span class="tag">${hv?'Pending inspection':'Self-declared'}</span></div>
      <div class="row"><b>${esc(SF.product||'Your item')}</b><span><span class="display" style="font-size:44px">~${base.toFixed(1)}</span><b class="muted">/10</b></span></div>
      <p class="muted" style="margin:0">${hv?'This is an estimate from your answers. The final score comes from the inspection.':'Based on your answers and photos. Buyers see this on your listing.'}</p></div>
      <button type="button" class="go" data-next>Continue to pricing</button>`}
    case 5:return `<div><label class="lbl" for="price">Your asking price</label><label class="inp" style="display:flex;align-items:center;gap:8px"><b>₹</b><input id="price" inputmode="numeric" value="${esc(SF.price)}" placeholder="[YOUR PRICE]" style="border:0;outline:0;background:transparent;flex:1;min-width:0;font-size:16px"></label></div>
      <p class="muted" style="margin:0;font-size:14px">Items with a Condition Report and realistic pricing tend to get serious buyers.</p>
      <p class="err" id="e5">Enter a price in rupees to continue.</p>
      <button type="button" class="go" data-next>Continue to publish</button>`;
    case 6:return `<div class="box" style="display:flex;flex-direction:column;gap:8px">
      <div class="row"><span class="muted">Item</span><b>${esc(SF.product)}</b></div>
      <div class="row"><span class="muted">City</span><b>${esc(city)}</b></div>
      <div class="row"><span class="muted">Age · Condition</span><b>${esc(SF.age)} · ${esc(SF.cond)}</b></div>
      <div class="row"><span class="muted">Price</span><b>${inr(+SF.price)}</b></div></div>
      <button type="button" class="go" data-next>${hv?'Submit for verification':'Publish listing'}</button>`;
  }};
  app.innerHTML=`<div class="wrap"><div class="sell-grid">
    <div>
      <nav class="crumb" aria-label="Breadcrumb"><button type="button" id="back">Sell</button><span>/</span><span>${esc(city)}</span><span>/</span><span style="color:var(--ink)">${esc(CATS[cat][0])}</span></nav>
      <h1 class="display">Let’s get your item listed.</h1>
      <p class="muted" style="margin:0;font-size:18px;max-width:620px">Six short steps. We guide you through each one, and handle verification, pickup and delivery when it sells.</p>
      <ol class="steps">${STEP_T.map(([t,s],i)=>{const n=i+1;const cls=n===SF.step?'active':n<SF.max||(n<SF.step)?'done':'';return `
        <li class="st ${cls}"><button type="button" class="st-h" data-open="${n}" ${n>SF.max?'disabled':''} aria-expanded="${n===SF.step}">
          <span class="n">${cls==='done'&&n!==SF.step?ic('check',20,2.6):n}</span><span style="flex:1"><b>${t}</b><small>${s}</small></span>
          ${n===3&&hv?'<span class="score mid">Required for high-value items</span>':''}</button>
          ${n===SF.step?`<div class="st-b">${body(n)}</div>`:''}</li>`}).join('')}</ol>
    </div>
    <aside class="side">
      <div class="verify">${ic('shield',30,1.9).replace('class="i"','class="i v"')}
        <h2 class="display">We’ll verify it before it goes live.</h2>
        <p>High-value items (above [₹ VALUE THRESHOLD]), including cars, properties and premium electronics, are physically inspected by a FreeSell agent before your listing is published.</p>
        <ul><li><span class="v">${ic('check',20,2.6)}</span>An agent visits at a time you choose</li><li><span class="v">${ic('check',20,2.6)}</span>You get a scored Condition Report</li><li><span class="v">${ic('check',20,2.6)}</span>Your listing carries the FreeSell Inspected badge</li></ul>
      </div>
      <div class="aux"><span class="ic" style="background:var(--amber-soft);color:var(--amber-ink)">${ic('truck',24)}</span><div><b>Pickup &amp; delivery, handled</b><div class="muted" style="font-size:15px">Once it sells, FreeSell can collect it from your door and deliver it to the buyer.</div></div></div>
      <div class="aux"><span class="ic" style="background:var(--accent-soft);color:var(--accent-ink)">${ic('user',24)}</span><div><b>Only verified buyers</b><div class="muted" style="font-size:15px">Every buyer who contacts you has a verified FreeSell account.</div></div></div>
    </aside></div></div>`;
  app.querySelector('#back').onclick=()=>go('/');
  const cc=app.querySelector('#chgCat');if(cc)cc.onclick=()=>{S.cat=null;go('/');setTimeout(()=>advance('step-cat'),50)};
  const prod=app.querySelector('#prod');if(prod)prod.oninput=e=>SF.product=e.target.value;
  const price=app.querySelector('#price');if(price)price.oninput=e=>{e.target.value=e.target.value.replace(/\D/g,'');SF.price=e.target.value};
  const files=app.querySelector('#files');if(files)files.onchange=e=>{SF.files=e.target.files.length;render()};
  app.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{SF[b.dataset.g]=b.dataset.v;render()});
  app.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{SF.step=+b.dataset.open;render()});
  const nx=app.querySelector('[data-next]');if(nx)nx.onclick=()=>{
    const ok={1:SF.product.trim()&&SF.age&&SF.cond,2:(SF.photo==='upload'&&SF.files>0)||(SF.photo==='agent'&&SF.visit),5:+SF.price>0}[SF.step];
    if(ok===undefined||ok){if(SF.step===6){SF.published=true;render();window.scrollTo(0,0);return}SF.step++;SF.max=Math.max(SF.max,SF.step);render();
      const a=app.querySelector('.st.active');a&&a.scrollIntoView({block:'nearest'})}
    else{const e=app.querySelector('#e'+SF.step);if(e)e.style.display='block'}
  };
}

/* ---------- ROUTER ---------- */
function render(){
  const parts=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean).map(decodeURIComponent);
  if(parts[0]==='search'){S.q=parts[1]||'';market(null,null)}
  else if(parts[0]==='buy'&&CATS[parts[2]]){S.mode='buy';S.city=parts[1];S.cat=parts[2];market(parts[1],parts[2])}
  else if(parts[0]==='sell'&&CATS[parts[2]]){if(S.mode!=='sell'||S.city!==parts[1]||S.cat!==parts[2]){Object.assign(SF,{step:1,max:1,published:false})}S.mode='sell';S.city=parts[1];S.cat=parts[2];sellFlow(parts[1],parts[2])}
  else home();
}
let lastHash=location.hash;
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});

/* header actions */
function navTo(k){
  closeMenus();
  const presets={buy:['buy',null],sell:['sell',null],rent:['buy','properties'],cars:['buy','cars'],properties:['buy','properties']};
  const [m,c]=presets[k];S.mode=m;S.cat=c;
  if(S.city&&S.cat){finish();return}
  if(location.hash&&location.hash!=='#/'){go('/');setTimeout(()=>advance('step-city'),30)}else{render();advance('step-city')}
}
document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>navTo(b.dataset.nav)));
const sb=document.getElementById('searchbar'),sbtn=document.getElementById('searchBtn'),mn=document.getElementById('mnav'),mb=document.getElementById('menuBtn');
function closeMenus(){sb.classList.remove('open');mn.classList.remove('open');sbtn.setAttribute('aria-expanded','false');mb.setAttribute('aria-expanded','false')}
sbtn.onclick=()=>{const o=!sb.classList.contains('open');closeMenus();sb.classList.toggle('open',o);sbtn.setAttribute('aria-expanded',o);if(o)document.getElementById('q').focus()};
mb.onclick=()=>{const o=!mn.classList.contains('open');closeMenus();mn.classList.toggle('open',o);mb.setAttribute('aria-expanded',o)};
document.getElementById('searchForm').onsubmit=e=>{e.preventDefault();S.q=document.getElementById('q').value.trim();if(!S.q)return;closeMenus();location.hash='/search/'+encodeURIComponent(S.q);render()};
const dlg=document.getElementById('login');
document.querySelectorAll('[data-login]').forEach(b=>b.onclick=()=>{closeMenus();document.getElementById('otpMsg').style.display='none';document.getElementById('phoneErr').style.display='none';dlg.showModal()});
document.getElementById('sendOtp').onclick=()=>{const v=document.getElementById('phone').value.replace(/\D/g,'');const ok=v.length===10;document.getElementById('phoneErr').style.display=ok?'none':'block';document.getElementById('otpMsg').style.display=ok?'block':'none'};

paintIcons();
render();
</script>
</body>
</html>
